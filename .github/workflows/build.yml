name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Signatur prüfen
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          $BT/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk | tail -3

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk FotoAufraeumer.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Foto-Aufräumer 1.0.${{ github.run_number }}
          body: |
            Zum Installieren auf dem Handy unten **FotoAufraeumer.apk** antippen.
          files: FotoAufraeumer.apk
          make_latest: true

      - name: Build-Protokoll bei Fehler hochladen
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Build-Protokoll (letzter Fehler)
          prerelease: true
          files: build.log
          make_latest: false
